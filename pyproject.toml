[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragscore"
version = "0.1.0"
description = "A retrieval regression gate that reports when a golden set is too small to judge a change."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Vaishnavi Lolla" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]
evidence = [
    "cmarkgfm>=2022.10.27",
    "playwright>=1.40",
]

[project.scripts]
ragscore = "ragscore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
